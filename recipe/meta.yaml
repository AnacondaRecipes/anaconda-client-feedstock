{% set version = "1.16.0" %}

package:
  name: anaconda-client
  version: {{ version }}

source:
  url: https://github.com/anaconda/anaconda-client/archive/{{ version }}.tar.gz
  sha256: 3abb6246aae258dde2cf06a72959ab6fe18385261c1e1b931f4208b6f6fb531e

build:
  number: 0
  script: {{ PYTHON }} -m pip install --no-build-isolation --no-deps . -vv
  entry_points:
    - binstar = binstar_client.scripts.cli:main
    - conda-server = binstar_client.scripts.cli:main

requirements:
  host:
    - pip
    - python
    - hatchling
    - hatch-vcs >=0.3
    - setuptools-scm >=7.1
    - hatch-requirements-txt
  run:
    # Based on:
    # requirements.txt, conda.recipe/meta.yaml, requirements-extra.txt
    - python
    - anaconda-anon-usage >=0.7.3
    - anaconda-cli-base >=0.9.1
    - anaconda-auth >=0.12.3
    - anaconda-opentelemetry >=1.2.2
    # click 8.5.0 deprecates click.utils.get_binary_stream, which typer<0.26.0 still imports
    - click==8.4.1
    - conda-package-handling >=1.7.3
    - conda-package-streaming >=0.9.0
    - defusedxml >=0.7.1
    - nbformat >=4.4.0
    - packaging
    - platformdirs >=3.10.0,<5.0
    - python-dateutil >=2.6.1
    - pytz >=2021.3
    - pyyaml >=3.12
    - requests >=2.20.0
    - requests-toolbelt >=0.9.1
    - setuptools >=58.0.4
    - tqdm >=4.56.0
    # unpinned typer pulls in click 8.5.0 which we don't want
    - typer <0.27
    - urllib3 >=1.26.4
  run_constrained:
    - anaconda-project >=0.9.1
    - pillow >=10.2.0

{% set ignore_tests = "" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/test_copy.py" %}  # [osx]
{% set ignore_tests = ignore_tests + " --ignore=tests/test_groups.py" %}  # [osx]
{% set ignore_tests = ignore_tests + " --ignore=tests/test_login.py" %}  # [osx]
{% set ignore_tests = ignore_tests + " --ignore=tests/test_update.py" %}  # [osx]
{% set ignore_tests = ignore_tests + " --ignore=tests/test_upload.py" %}  # [osx]
{% set ignore_tests = ignore_tests + " --ignore=tests/test_whoami.py" %}  # [osx]
{% set ignore_tests = ignore_tests + " --ignore=tests/utils/test_config.py" %}  # [osx]

# Skip tests that require network access or cause "Too many open files" errors
# Only seen on CI, not replicated locally.
{% set tests_to_skip = "test_login_unified" %}
{% set tests_to_skip = tests_to_skip + " or test_download_arg_parsing" %}  # [osx]
{% set tests_to_skip = tests_to_skip + " or test_write_env" %}  # [osx]
{% set tests_to_skip = tests_to_skip + " or test_find_conda" %}  # [osx]
{% set tests_to_skip = tests_to_skip + " or test_has_environment" %}  # [osx]
{% set tests_to_skip = tests_to_skip + " or test_local_image" %}  # [osx]

test:
  imports:
    - binstar_client
    - binstar_client.commands
    - binstar_client.inspect_package
    - binstar_client.mixins
    - binstar_client.scripts
    - binstar_client.utils
    - binstar_client.utils.notebook
  source_files:
    - tests
  requires:
    - conda
    - pip
    - pytest >=8.4
    - pytest-mock >=3.15
    - pillow
    - click 8.4.1
    - typer 0.25.1
    - freezegun >=1.5
  commands:
    - pip check
    - export ANACONDA_CLI_FORCE_NEW=1  # [unix]
    - set ANACONDA_CLI_FORCE_NEW=1     # [win]
    - anaconda -h
    - anaconda -V
    - anaconda org --help
    - python -c "import binstar_client; print(f'binstar_client.__version__ is {binstar_client.__version__}')"
    - python -c "import binstar_client; assert binstar_client.__version__ == \"{{ version }}\""
    - pytest -vv {{ ignore_tests }} -k "not ({{ tests_to_skip }})" tests

about:
  home: https://anaconda.org
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.md
  summary: anaconda.org command line client library
  description: |
    Anaconda-client is used to connect to and manage your packages on anaconda.org, upload packages you have created
    and generate access tokens to allow access to private packages.
  doc_url: https://www.anaconda.com/docs/tools/anaconda-org
  dev_url: https://github.com/anaconda/anaconda-client

extra:
  skip-lints:
    - python_build_tools_in_host
    - python_build_tool_in_run